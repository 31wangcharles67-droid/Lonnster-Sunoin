<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Lonnster Sonion</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="title-row">
        <div>
          <p class="eyebrow">PRACTICE BREAK ARCADE</p>
          <h1>Lonnster Sonion</h1>
        </div>
        <div class="badge">RACE YOUR BEST</div>
      </header>
      <section id="game-root" aria-label="Lonnster Sonion racing game"></section>
      <p class="hint">Arrow keys steer · Space boosts · On phone, tap left/right or use the buttons</p>
    </main>
    <script>
      window.THREE_READY = new Promise((resolve, reject) => {
        const urls = [
          "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js",
          "https://cdnjs.cloudflare.com/ajax/libs/three.js/r161/three.min.js"
        ];
        const load = index => {
          if (index >= urls.length) { reject(new Error("Three.js CDN unavailable")); return; }
          const script = document.createElement("script");
          script.src = urls[index]; script.onload = resolve; script.onerror = () => load(index + 1); document.head.appendChild(script);
        };
        load(0);
      });
    </script>
    <script src="game.js"></script>
  </body>
</html>
